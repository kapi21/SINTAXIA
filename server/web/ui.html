<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SINTAXIA — Panel CPC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cpc-black: #000000;
      --cpc-blue: #0000d4;
      --cpc-blue2: #0080ff;
      --cpc-yellow: #ffff55;
      --cpc-amber: #ffb000;
      --cpc-cyan: #55ffff;
      --cpc-white: #ffffff;
      --cpc-red: #ff5555;
      --cpc-green: #55ff55;
      --cpc-gray: #808080;
      --pixel: "Press Start 2P", monospace;
      --term: "VT323", "Courier New", monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--cpc-blue);
      color: var(--cpc-yellow);
      font-family: var(--term);
      font-size: 22px;
      line-height: 1.25;
      overflow-x: hidden;
    }
    /* Marco tipo monitor CPC */
    .bezel {
      max-width: 1080px;
      margin: 0.75rem auto 1.5rem;
      background: #1a1a1a;
      border: 10px solid #333;
      box-shadow:
        inset 0 0 0 4px #111,
        0 0 0 6px #555,
        0 12px 0 #0a0a0a;
      position: relative;
    }
    .screen {
      background: var(--cpc-black);
      border: 6px solid var(--cpc-blue);
      position: relative;
      overflow: hidden;
    }
    .screen::after {
      content: "";
      pointer-events: none;
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.035) 0px,
        rgba(255,255,255,0.035) 1px,
        transparent 2px,
        transparent 3px
      );
      animation: scan 8s linear infinite;
      z-index: 5;
    }
    @keyframes scan {
      from { background-position: 0 0; }
      to { background-position: 0 60px; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes borderPulse {
      0%, 100% { border-color: var(--cpc-blue); }
      50% { border-color: var(--cpc-blue2); }
    }
    .screen { animation: borderPulse 3.5s ease-in-out infinite; }

    /* Hero full-bleed */
    .hero {
      position: relative;
      width: 100%;
      min-height: 220px;
      background: #000 url("/assets/hero.png") center / cover no-repeat;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to right, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.15) 55%, transparent 100%),
        linear-gradient(to top, rgba(0,0,0,0.75) 0%, transparent 50%);
    }
    .hero-copy {
      position: relative;
      z-index: 2;
      margin: 1rem 1rem 1.1rem;
      padding: 0.95rem 1rem 0.85rem;
      max-width: 36rem;
      background: rgba(0, 0, 0, 0.82);
      border: 3px solid var(--cpc-amber);
      box-shadow:
        4px 4px 0 #000,
        inset 0 0 0 2px #000;
    }
    .brand {
      font-family: var(--pixel);
      font-size: clamp(1rem, 3.2vw, 1.55rem);
      color: var(--cpc-amber);
      text-shadow: 2px 2px 0 #000;
      margin: 0 0 0.65rem;
      letter-spacing: 0.04em;
      line-height: 1.45;
    }
    .tagline {
      margin: 0;
      color: var(--cpc-cyan);
      font-size: 1.3rem;
      max-width: none;
      text-shadow: 1px 1px 0 #000;
    }
    .bootline {
      margin: 0.7rem 0 0;
      color: var(--cpc-green);
      font-size: 1.15rem;
      text-shadow: 1px 1px 0 #000;
    }
    .bootline .cursor {
      display: inline-block;
      width: 0.6ch;
      background: var(--cpc-green);
      animation: blink 1s step-end infinite;
      margin-left: 2px;
      height: 1em;
      vertical-align: text-bottom;
    }

    .chrome {
      padding: 0.85rem 1rem 1.2rem;
      position: relative;
      z-index: 2;
    }
    .ascii-bar {
      font-family: var(--term);
      color: var(--cpc-blue2);
      white-space: nowrap;
      overflow: hidden;
      margin: 0 0 0.75rem;
      letter-spacing: 0.02em;
    }
    .grid {
      display: grid;
      gap: 0.9rem;
      grid-template-columns: 1fr;
    }
    @media (min-width: 900px) {
      .grid { grid-template-columns: 1.05fr 0.95fr; }
      .hero { min-height: 280px; }
    }

    .panel {
      border: 3px solid var(--cpc-yellow);
      background: #000010;
      padding: 0.7rem 0.8rem 0.9rem;
      position: relative;
    }
    .panel h2 {
      margin: 0 0 0.55rem;
      font-family: var(--pixel);
      font-size: 0.62rem;
      color: var(--cpc-amber);
      letter-spacing: 0.06em;
      line-height: 1.6;
    }
    .panel h2::before { content: "> "; color: var(--cpc-cyan); }

    label {
      display: block;
      margin: 0.55rem 0 0.15rem;
      color: var(--cpc-cyan);
      font-size: 1.05rem;
    }
    input, select, textarea, button {
      font-family: var(--term);
      font-size: 1.2rem;
    }
    input, select, textarea {
      width: 100%;
      background: var(--cpc-black);
      color: var(--cpc-yellow);
      border: 2px solid var(--cpc-blue2);
      border-radius: 0;
      padding: 0.25rem 0.4rem;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--cpc-amber);
      box-shadow: none;
    }
    textarea {
      min-height: 130px;
      resize: vertical;
      line-height: 1.2;
    }
    .row { display: grid; gap: 0.6rem; grid-template-columns: 1fr 1fr; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 0.85rem;
    }
    button {
      cursor: pointer;
      border: 2px solid var(--cpc-amber);
      background: var(--cpc-black);
      color: var(--cpc-amber);
      padding: 0.28rem 0.65rem;
      border-radius: 0;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      transition: background 0.15s, color 0.15s, transform 0.1s;
    }
    button:hover {
      background: var(--cpc-amber);
      color: #000;
      transform: translate(-1px, -1px);
    }
    button:active { transform: translate(1px, 1px); }
    button.primary {
      background: var(--cpc-amber);
      color: #000;
      border-color: var(--cpc-white);
    }
    button.danger {
      border-color: var(--cpc-red);
      color: var(--cpc-red);
    }
    button.danger:hover {
      background: var(--cpc-red);
      color: #000;
    }

    .status {
      font-size: 1.15rem;
      padding: 0.35rem 0.5rem;
      margin-bottom: 0.55rem;
      border: 2px dashed var(--cpc-gray);
      color: var(--cpc-white);
      background: #000;
    }
    .status.ok {
      border-color: var(--cpc-green);
      color: var(--cpc-green);
    }
    .status.bad {
      border-color: var(--cpc-red);
      color: var(--cpc-red);
    }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: var(--term);
      font-size: 1.15rem;
      color: var(--cpc-green);
      background: #000;
      border: 2px solid var(--cpc-blue);
      padding: 0.45rem 0.5rem;
      min-height: 4.5rem;
    }
    .hint {
      color: var(--cpc-gray);
      font-size: 1rem;
      margin: 0.55rem 0 0;
    }
    .toast {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      background: #000;
      color: var(--cpc-amber);
      border: 3px solid var(--cpc-amber);
      padding: 0.45rem 0.75rem;
      font-family: var(--pixel);
      font-size: 0.55rem;
      line-height: 1.5;
      display: none;
      z-index: 20;
    }
    .led {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: var(--cpc-red);
      margin-right: 0.4rem;
      box-shadow: 0 0 0 2px #000;
      animation: blink 1.2s step-end infinite;
      vertical-align: middle;
    }
    .status.ok .led {
      background: var(--cpc-green);
      animation: none;
    }

    /* Ayuda solo al pasar por el ? */
    .tip-q {
      display: inline-block;
      margin-left: 0.25rem;
      padding: 0 0.2rem;
      color: var(--cpc-gray);
      cursor: help;
      font-size: 0.95em;
      line-height: 1;
      vertical-align: middle;
      border: 1px solid var(--cpc-gray);
      user-select: none;
    }
    .tip-q:hover,
    .tip-q:focus {
      color: var(--cpc-amber);
      border-color: var(--cpc-amber);
      outline: none;
    }
    h2 .tip-q {
      font-family: var(--term);
      font-size: 0.9rem;
      font-weight: normal;
      letter-spacing: 0;
    }
    #tipBubble {
      position: fixed;
      z-index: 40;
      max-width: min(22rem, calc(100vw - 1.5rem));
      padding: 0.55rem 0.7rem;
      background: #000;
      color: var(--cpc-cyan);
      border: 3px solid var(--cpc-amber);
      box-shadow: 4px 4px 0 #000;
      font-family: var(--term);
      font-size: 1.1rem;
      line-height: 1.3;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.12s ease;
    }
    #tipBubble.show {
      opacity: 1;
      visibility: visible;
    }
    #tipBubble .tip-title {
      display: block;
      color: var(--cpc-amber);
      font-family: var(--pixel);
      font-size: 0.48rem;
      letter-spacing: 0.05em;
      margin-bottom: 0.35rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="bezel">
    <div class="screen">
      <div class="hero" role="img" aria-label="Ilustracion pixel: monitor CPC, castillo y aventura de texto SINTAXIA">
        <div class="hero-copy">
          <h1 class="brand">SINTAXIA</h1>
          <p class="tagline">Aventura conversacional. IA + Amstrad CPC + M4.</p>
          <p class="bootline">Ready.<span class="cursor"></span></p>
        </div>
      </div>

      <div class="chrome">
        <p class="ascii-bar" data-tip-title="PANEL"
           data-tip="Panel de control en el PC. El Amstrad habla con este servidor por Wi‑Fi (M4).">+-- MODE 1 PANEL -- M4 WiFi -- AY-3-8912 -- LLM MASTER --+</p>
        <div class="grid">
          <section class="panel">
            <h2 data-tip-title="MOTOR"
                data-tip="Aqui configuras como habla el maestro de la aventura: IA real, pruebas sin IA, modelo y tono.">Motor</h2>
            <div id="statusBox" class="status"
                 data-tip-title="ESTADO"
                 data-tip="Resumen rapido: si el servidor responde, modo (IA o Mock), modelo activo y cuantos turnos lleva la conversacion (H)."><span class="led"></span>Cargando…</div>
            <label for="mode" data-tip-title="MODO"
                   data-tip="IA: el maestro inventa la historia con un modelo de lenguaje. Mock: respuestas fijas para probar conexion sin Ollama ni API.">Modo</label>
            <select id="mode"
                    data-tip-title="MODO"
                    data-tip="IA: el maestro inventa la historia con un modelo de lenguaje. Mock: respuestas fijas para probar conexion sin Ollama ni API.">
              <option value="ai" data-tip-title="IA" data-tip="Usa un LLM (Ollama u otra API) para narrar cada turno.">IA (LLM)</option>
              <option value="mock" data-tip-title="MOCK" data-tip="Sin inteligencia artificial: utiles para comprobar que el CPC y el PC se entienden.">Mock (sin IA)</option>
            </select>
            <label for="provider" data-tip-title="PROVEEDOR"
                   data-tip="Quien genera el texto. Ollama local, o APIs cloud (OpenAI, Claude, Gemini), o cualquier servidor Compatible.">Proveedor</label>
            <select id="provider"
                    data-tip-title="PROVEEDOR"
                    data-tip="Quien genera el texto. Ollama local, o APIs cloud (OpenAI, Claude, Gemini), o cualquier servidor Compatible.">
              <option value="ollama" data-tip-title="OLLAMA" data-tip="API nativa de Ollama en tu PC (recomendado para la PoC).">Ollama (local)</option>
              <option value="openai" data-tip-title="OPENAI" data-tip="API oficial de OpenAI (api.openai.com). Necesitas API key.">OpenAI</option>
              <option value="claude" data-tip-title="CLAUDE" data-tip="API de Anthropic (Claude). Necesitas API key de console.anthropic.com.">Claude (Anthropic)</option>
              <option value="gemini" data-tip-title="GEMINI" data-tip="API de Google Gemini. Necesitas API key de Google AI Studio. Habla directo con Google.">Gemini (Google)</option>
              <option value="openai_compat" data-tip-title="COMPATIBLE" data-tip="Cualquier servidor con API tipo /v1/chat/completions (LM Studio, Ollama /v1, proxies…).">Compatible (OpenAI API)</option>
            </select>
            <div class="row">
              <div>
                <label for="model" data-tip-title="MODELO"
                       data-tip="Modelo del proveedor seleccionado. Pulsa 'Modelos' para cargar la lista disponible o escribe el id a mano.">Modelo</label>
                <div style="display:flex;gap:0.3rem;align-items:center">
                  <select id="modelSelect" style="flex:1;min-width:0"
                          data-tip-title="MODELO"
                          data-tip="Modelos disponibles del proveedor. Se cargan al pulsar 'Modelos' o al cambiar proveedor.">
                    <option value="">-- elige o escribe abajo --</option>
                  </select>
                </div>
                <input id="model" list="modelList" placeholder="llama3.1:8b" style="margin-top:0.25rem"
                       data-tip-title="MODELO (manual)"
                       data-tip="Puedes escribir el id del modelo aqui si no aparece en la lista. Tiene prioridad sobre el selector." />
                <datalist id="modelList"></datalist>
              </div>
              <div>
                <label for="temperature" data-tip-title="TEMPERATURA"
                       data-tip="Creatividad del maestro. Bajo (0–0.4): mas previsible. Medio (0.6–0.8): equilibrado. Alto (1+): mas inventivo e imprevisible.">Temperatura</label>
                <input id="temperature" type="number" min="0" max="2" step="0.1" value="0.7"
                       data-tip-title="TEMPERATURA"
                       data-tip="Creatividad del maestro. Bajo (0–0.4): mas previsible. Medio (0.6–0.8): equilibrado. Alto (1+): mas inventivo e imprevisible." />
              </div>
            </div>
            <label for="ollama_url" data-tip-title="URL OLLAMA"
                   data-tip="Direccion del chat de Ollama. Por defecto suele ser http://127.0.0.1:11434/api/chat">URL Ollama chat</label>
            <input id="ollama_url" placeholder="http://127.0.0.1:11434/api/chat"
                   data-tip-title="URL OLLAMA"
                   data-tip="Direccion del chat de Ollama. Por defecto suele ser http://127.0.0.1:11434/api/chat" />
            <label for="api_base" data-tip-title="BASE API"
                   data-tip="URL base del proveedor cloud o compatible (sin el path final de chat). En Ollama se usa sobre todo la URL de chat de arriba.">Base API</label>
            <input id="api_base" placeholder="https://api.openai.com/v1"
                   data-tip-title="BASE API"
                   data-tip="URL base del proveedor cloud o compatible (sin el path final de chat). En Ollama se usa sobre todo la URL de chat de arriba." />
            <label for="api_key" data-tip-title="API KEY"
                   data-tip="Clave de OpenAI, Anthropic (Claude) o Google (Gemini). Solo en memoria del servidor; no hace falta con Ollama local.">API key</label>
            <input id="api_key" type="password" placeholder="(opcional)"
                   data-tip-title="API KEY"
                   data-tip="Clave de OpenAI, Anthropic (Claude) o Google (Gemini). Solo en memoria del servidor; no hace falta con Ollama local." />
            <label for="system" data-tip-title="SYSTEM PROMPT"
                   data-tip="Instrucciones fijas del maestro: tono, reglas de la aventura y formato. Cambialo con cuidado: afecta a toda la partida.">System prompt</label>
            <textarea id="system"
                      data-tip-title="SYSTEM PROMPT"
                      data-tip="Instrucciones fijas del maestro: tono, reglas de la aventura y formato. Cambialo con cuidado: afecta a toda la partida."></textarea>
            <div class="actions">
              <button class="primary" id="btnSave"
                      data-tip-title="GUARDAR CONFIG"
                      data-tip="Aplica en el servidor el modo, proveedor, modelo, temperatura, URLs, clave y prompt. Sin esto, los cambios no cuentan.">Guardar</button>
              <button id="btnModels"
                      data-tip-title="MODELOS"
                      data-tip="Consulta la API del proveedor actual y carga los modelos disponibles en el selector. Necesita api_key si es OpenAI/Claude/Gemini.">Modelos ↺</button>
              <button class="danger" id="btnReset"
                      data-tip-title="NUEVA PARTIDA"
                      data-tip="Borra el estado actual (lugar, inventario, historia) y empieza de cero. No borra los slots guardados.">Nueva</button>
              <button id="btnRefresh"
                      data-tip-title="REFRESH"
                      data-tip="Vuelve a leer del servidor estado, configuracion y lista de partidas guardadas.">Refresh</button>
            </div>
            <p class="hint"
               data-tip-title="RUTAS"
               data-tip="El Amstrad usa /ping, /turn y /reset. Este panel vive en /ui.">CPC: /ping /turn /reset — Panel: /ui</p>
          </section>

          <section class="panel">
            <h2 data-tip-title="PAQUETE CPC"
                data-tip="Lo que ve el Amstrad tras cada turno: texto (T:), sonido (S:) y si la aventura termino (E:). Tambien estado y partidas.">Paquete al CPC</h2>
            <label data-tip-title="ESTADO PARTIDA"
                   data-tip="Donde estas, que llevas encima y marcas internas de la historia (puertas abiertas, etc.).">Estado partida</label>
            <pre id="gameState"
                 data-tip-title="ESTADO PARTIDA"
                 data-tip="Donde estas, que llevas encima y marcas internas de la historia (puertas abiertas, etc.).">(vacio)</pre>
            <label data-tip-title="SLOTS"
                   data-tip="Tres huecos de guardado en el PC. Puedes usarlos desde aqui o con SAVE/LOAD en el Amstrad.">Partidas (slots 1-3)</label>
            <pre id="savesBox"
                 data-tip-title="SLOTS"
                 data-tip="Tres huecos de guardado en el PC. Puedes usarlos desde aqui o con SAVE/LOAD en el Amstrad.">(cargando)</pre>
            <div class="row">
              <input id="saveName" placeholder="nombre opcional"
                     data-tip-title="NOMBRE PARTIDA"
                     data-tip="Etiqueta opcional para reconocer el slot (ej. antes del castillo).">
              <select id="saveSlot"
                      data-tip-title="ELEGIR SLOT"
                      data-tip="Elige el hueco 1, 2 o 3 donde guardar o desde el que cargar.">
                <option value="1">Slot 1</option>
                <option value="2">Slot 2</option>
                <option value="3">Slot 3</option>
              </select>
            </div>
            <div class="actions">
              <button id="btnSaveSlot"
                      data-tip-title="GUARDAR SLOT"
                      data-tip="Guarda la partida actual en el slot elegido (con el nombre opcional).">Guardar</button>
              <button id="btnLoadSlot"
                      data-tip-title="CARGAR SLOT"
                      data-tip="Restaura la partida del slot elegido. Sustituye el estado actual del servidor.">Cargar</button>
              <button class="danger" id="btnDeleteSlot"
                      data-tip-title="BORRAR SLOT"
                      data-tip="Elimina la partida guardada en el slot seleccionado de la memoria del PC.">Borrar</button>
              <button id="btnListSaves"
                      data-tip-title="LISTAR"
                      data-tip="Actualiza la lista de los tres slots y muestra si estan vacios u ocupados.">Listar</button>
            </div>
            <label data-tip-title="ULTIMO JUGADOR"
                   data-tip="Ultimo mensaje o comando que envio el jugador (desde el CPC o desde Probar turno).">Jugador</label>
            <pre id="lastUser"
                 data-tip-title="ULTIMO JUGADOR"
                 data-tip="Ultimo mensaje o comando que envio el jugador (desde el CPC o desde Probar turno).">(nada aun)</pre>
            <label data-tip-title="RESPUESTA"
                   data-tip="Paquete crudo hacia el CPC: T: texto en lineas, S: numero de sonido (0–5), E: 0 sigue / 1 fin de aventura.">Respuesta T:/S:/E:</label>
            <pre id="lastPacket"
                 data-tip-title="RESPUESTA"
                 data-tip="Paquete crudo hacia el CPC: T: texto en lineas, S: numero de sonido (0–5), E: 0 sigue / 1 fin de aventura.">(nada aun)</pre>
            <label data-tip-title="ERROR LLM"
                   data-tip="Si la IA falla (Ollama apagado, modelo inexistente, red…), aqui aparece el mensaje de error.">Error LLM</label>
            <pre id="lastError"
                 data-tip-title="ERROR LLM"
                 data-tip="Si la IA falla (Ollama apagado, modelo inexistente, red…), aqui aparece el mensaje de error.">—</pre>
            <label for="testMsg" data-tip-title="PROBAR TURNO"
                   data-tip="Simula un turno sin Amstrad: escribe una accion y pulsa Enviar para ver el paquete de respuesta.">Probar turno</label>
            <div class="row">
              <input id="testMsg" placeholder="miro alrededor"
                     data-tip-title="ACCION DE PRUEBA"
                     data-tip="Texto como si lo escribieras en el CPC (ej. miro alrededor, abro la puerta).">
              <button id="btnTest"
                      data-tip-title="ENVIAR TURNO"
                      data-tip="Manda la accion al servidor (/turn) y actualiza la respuesta T:/S:/E: y el estado.">Enviar</button>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <div id="tipBubble" role="tooltip" aria-hidden="true"></div>
  <script>
    const $ = (id) => document.getElementById(id);
    function toast(msg) {
      const t = $("toast");
      t.textContent = msg;
      t.style.display = "block";
      setTimeout(() => t.style.display = "none", 2200);
    }

    /* Popups de ayuda solo al pasar por el ? */
    (function setupTips() {
      const bubble = $("tipBubble");
      let hideTimer = null;

      // Quitar tip de controles (inputs/selects/etc.): la ayuda va solo en el ?
      const stripTags = new Set(["INPUT", "SELECT", "TEXTAREA", "PRE", "OPTION"]);
      document.querySelectorAll("[data-tip]").forEach((el) => {
        if (stripTags.has(el.tagName)) {
          el.removeAttribute("data-tip");
          el.removeAttribute("data-tip-title");
        }
      });

      // Crear un ? clicable/hover junto a cada concepto
      document.querySelectorAll("[data-tip]").forEach((el) => {
        if (el.classList.contains("tip-q")) return;
        const tip = el.getAttribute("data-tip");
        const title = el.getAttribute("data-tip-title") || "";
        el.removeAttribute("data-tip");
        el.removeAttribute("data-tip-title");
        const q = document.createElement("span");
        q.className = "tip-q";
        q.textContent = "?";
        q.setAttribute("data-tip", tip);
        if (title) q.setAttribute("data-tip-title", title);
        q.setAttribute("tabindex", "0");
        q.setAttribute("role", "img");
        q.setAttribute("aria-label", "Ayuda" + (title ? ": " + title : ""));
        if (el.id === "statusBox" || el.tagName === "BUTTON") {
          el.insertAdjacentElement("afterend", q);
        } else {
          el.appendChild(document.createTextNode(" "));
          el.appendChild(q);
        }
      });

      function hide() {
        bubble.classList.remove("show");
        bubble.setAttribute("aria-hidden", "true");
      }
      function place(el) {
        const tip = el.getAttribute("data-tip");
        if (!tip) return;
        const title = el.getAttribute("data-tip-title") || "";
        bubble.innerHTML = (title ? '<span class="tip-title">' + title + "</span>" : "") + tip;
        bubble.classList.add("show");
        bubble.setAttribute("aria-hidden", "false");
        const r = el.getBoundingClientRect();
        const pad = 10;
        let left = r.left;
        let top = r.bottom + 8;
        bubble.style.left = "0px";
        bubble.style.top = "0px";
        const br = bubble.getBoundingClientRect();
        if (left + br.width > window.innerWidth - pad) {
          left = Math.max(pad, window.innerWidth - br.width - pad);
        }
        if (top + br.height > window.innerHeight - pad) {
          top = Math.max(pad, r.top - br.height - 8);
        }
        bubble.style.left = left + "px";
        bubble.style.top = top + "px";
      }
      function showFor(el) {
        clearTimeout(hideTimer);
        place(el);
      }
      function scheduleHide() {
        clearTimeout(hideTimer);
        hideTimer = setTimeout(hide, 80);
      }
      document.addEventListener("mouseover", (e) => {
        const el = e.target.closest(".tip-q[data-tip]");
        if (!el) return;
        showFor(el);
      });
      document.addEventListener("mouseout", (e) => {
        const el = e.target.closest(".tip-q[data-tip]");
        if (!el) return;
        const to = e.relatedTarget;
        if (to && el.contains(to)) return;
        scheduleHide();
      });
      document.addEventListener("focusin", (e) => {
        const el = e.target.closest(".tip-q[data-tip]");
        if (el) showFor(el);
      });
      document.addEventListener("focusout", (e) => {
        const el = e.target.closest(".tip-q[data-tip]");
        if (el) scheduleHide();
      });
      window.addEventListener("scroll", hide, true);
      window.addEventListener("resize", hide);
    })();
    async function api(path, opts) {
      const r = await fetch(path, opts);
      if (!r.ok) throw new Error(await r.text());
      const ct = r.headers.get("content-type") || "";
      if (ct.includes("application/json")) return r.json();
      return r.text();
    }
    const PROVIDER_PRESETS = {
      ollama: {
        model: "llama3.1:8b",
        ollama_url: "http://127.0.0.1:11434/api/chat",
        api_base: "",
      },
      openai: {
        model: "gpt-4o-mini",
        api_base: "https://api.openai.com/v1",
      },
      claude: {
        model: "claude-haiku-4-5",
        api_base: "https://api.anthropic.com/v1",
      },
      gemini: {
        model: "gemini-2.0-flash",
        api_base: "https://generativelanguage.googleapis.com/v1beta",
      },
      openai_compat: {
        model: "llama3.1:8b",
        api_base: "http://127.0.0.1:11434/v1",
      },
    };

    // Proveedores que requieren API key para listar modelos
    const NEEDS_KEY = new Set(["openai", "claude", "gemini"]);

    async function loadModels(silent, forceKey) {
      const provider = $("provider").value;
      // Usar forceKey (pasada explícitamente) o leer del campo
      const rawKey  = forceKey !== undefined ? forceKey : $("api_key").value.trim();
      const rawBase = $("api_base").value.trim();
      const sel     = $("modelSelect");
      const btn     = $("btnModels");
      const prevText = btn.textContent;

      // Si el proveedor requiere key y no tenemos ninguna ni en campo ni guardada,
      // mostramos un aviso en el select en lugar de lanzar una llamada condenada al fracaso
      const keyPlaceholder = $("api_key").placeholder;
      const keyOnServer = keyPlaceholder === "(guardada)";
      if (NEEDS_KEY.has(provider) && !rawKey && !keyOnServer) {
        sel.innerHTML = "<option value=''>Introduce API key y pulsa ↺</option>";
        if (!silent) toast("Introduce la API key primero");
        return;
      }

      btn.textContent = "Cargando\u2026";
      btn.disabled = true;
      sel.innerHTML = "<option value=''>Cargando\u2026</option>";

      try {
        const url = "/api/models"
          + "?provider=" + encodeURIComponent(provider)
          + "&api_base=" + encodeURIComponent(rawBase)
          + "&api_key="  + encodeURIComponent(rawKey);
        const data = await api(url);
        const models = data.models || [];

        if (data.ok === false && data.error) {
          // Error devuelto por el servidor (401, timeout, etc.)
          sel.innerHTML = "<option value=''>ERROR: " + data.error.slice(0, 60) + "</option>";
          if (!silent) toast("ERROR: " + data.error);
          return;
        }

        // Rellena el <select>
        const prev = sel.value || $("model").value;
        sel.innerHTML = models.length
          ? "<option value=''>-- elige modelo --</option>"
          : "<option value=''>(sin modelos)</option>";
        models.forEach(m => {
          const o = document.createElement("option");
          o.value = m;
          o.textContent = m;
          if (m === prev) o.selected = true;
          sel.appendChild(o);
        });
        // Rellena datalist para autocompletar el input manual
        const list = $("modelList");
        list.innerHTML = "";
        models.forEach(m => {
          const o = document.createElement("option");
          o.value = m;
          list.appendChild(o);
        });
        // Si el select tiene el modelo actual, sincroniza el input
        if (sel.value) $("model").value = sel.value;
        if (!silent) toast(models.length + " MODELOS " + provider.toUpperCase());

      } catch (e) {
        sel.innerHTML = "<option value=''>Error de red: " + String(e).slice(0, 50) + "</option>";
        if (!silent) toast("ERROR: " + e);
      } finally {
        btn.textContent = prevText;
        btn.disabled = false;
      }
    }

    // Al cambiar proveedor: aplicar preset y disparar carga de modelos
    $("provider").addEventListener("change", () => {
      const p = $("provider").value;
      const preset = PROVIDER_PRESETS[p];
      if (!preset) return;
      if (preset.model) $("model").value = preset.model;
      if (preset.api_base !== undefined) $("api_base").value = preset.api_base;
      if (preset.ollama_url) $("ollama_url").value = preset.ollama_url;
      // Intentar carga — si falta key mostrará aviso en el select
      loadModels(true);
    });

    // Cuando el usuario elige del selector, rellena el input manual
    $("modelSelect").addEventListener("change", () => {
      const v = $("modelSelect").value;
      if (v) $("model").value = v;
    });

    // Cuando el usuario pega o teclea la API key → debounce 700ms → carga automática
    let _keyDebounce = null;
    $("api_key").addEventListener("input", () => {
      clearTimeout(_keyDebounce);
      _keyDebounce = setTimeout(() => {
        const key = $("api_key").value.trim();
        if (key) loadModels(true, key);
      }, 700);
    });

    function fill(cfg, status) {
      $("mode").value = status.mock ? "mock" : "ai";
      $("provider").value = cfg.provider || "ollama";
      $("model").value = cfg.model || "";
      $("temperature").value = cfg.temperature ?? 0.7;
      $("ollama_url").value = cfg.ollama_url || "";
      $("api_base").value = cfg.api_base || cfg.openai_base || "";
      $("system").value = cfg.system || "";
      $("api_key").value = "";
      $("api_key").placeholder = cfg.api_key_set ? "(guardada)" : "(opcional)";
      $("lastUser").textContent = cfg.last_user || "(nada aun)";
      $("lastPacket").textContent = cfg.last_packet || "(nada aun)";
      $("lastError").textContent = cfg.last_error || "—";
      const st = cfg.state || {};
      const inv = (st.inventory && st.inventory.length) ? st.inventory.join(", ") : "(vacio)";
      const flags = st.flags && Object.keys(st.flags).length
        ? Object.entries(st.flags).map(([k,v]) => k + "=" + (v ? "si" : "no")).join(", ")
        : "(ninguno)";
      $("gameState").textContent = "Lugar: " + (st.location || "?") + "\nInventario: " + inv + "\nFlags: " + flags;
      const box = $("statusBox");
      const mode = status.mock ? "MOCK" : (cfg.provider || "ollama").toUpperCase();
      box.innerHTML = '<span class="led"></span>READY · ' + mode + ' · ' + (cfg.model || '-') + ' · H' + (cfg.history_len || 0);
      box.className = "status ok";
    }
    async function refreshSaves() {
      const data = await api("/api/saves");
      const lines = (data.slots || []).map(s => {
        if (!s.occupied) return "Slot " + s.slot + ": (vacio)";
        return "Slot " + s.slot + ": " + (s.name || "") + " | " + (s.summary || "") + " | " + (s.saved_at || "");
      });
      $("savesBox").textContent = lines.join("\n") || "(sin datos)";
    }
    async function refresh() {
      const status = await api("/api/status");
      const cfg = await api("/api/config");
      fill(cfg, status);
      await refreshSaves();
      // Carga silenciosa de modelos (usa la key del servidor si está guardada)
      loadModels(true);
    }
    $("btnRefresh").onclick = () => refresh().catch(e => toast(String(e)));
    $("btnModels").onclick = () => loadModels(false);
    $("btnSave").onclick = async () => {
      const body = {
        mock: $("mode").value === "mock",
        provider: $("provider").value,
        model: $("model").value,
        temperature: Number($("temperature").value),
        ollama_url: $("ollama_url").value,
        api_base: $("api_base").value,
        openai_base: $("api_base").value,
        system: $("system").value,
      };
      const key = $("api_key").value.trim();
      if (key) body.api_key = key;
      const needsKey = NEEDS_KEY.has(body.provider);
      if (needsKey && !key && $("api_key").placeholder !== "(guardada)") {
        toast("PEGA LA API KEY");
        return;
      }
      await api("/api/config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      toast("CONFIG OK");
      // Guardamos la key antes de que fill() la limpie para pasarla a loadModels
      const savedKey = key;
      await refresh();
      // Si habíamos metido una key nueva, recargar modelos con ella
      if (savedKey) loadModels(false, savedKey);
    };
    $("btnReset").onclick = async () => {
      await api("/api/reset", { method: "POST" });
      toast("NUEVA PARTIDA");
      await refresh();
    };
    $("btnListSaves").onclick = () => refreshSaves().then(() => toast("SLOTS")).catch(e => toast(String(e)));
    $("btnSaveSlot").onclick = async () => {
      const slot = Number($("saveSlot").value);
      const name = $("saveName").value;
      await api("/api/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ slot, name }),
      });
      toast("SAVE " + slot);
      await refresh();
    };
    $("btnLoadSlot").onclick = async () => {
      const slot = Number($("saveSlot").value);
      const res = await api("/api/load", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ slot }),
      });
      if (res.packet) $("lastPacket").textContent = res.packet;
      toast("LOAD " + slot);
      await refresh();
    };
    $("btnDeleteSlot").onclick = async () => {
      const slot = Number($("saveSlot").value);
      const data = await api("/api/delete_save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ slot }),
      });
      if (data.deleted) {
        toast("BORRADO " + slot);
      } else {
        toast("SLOT " + slot + " VACIO");
      }
      await refresh();
    };
    $("btnModels").onclick = () => loadModels(false);
    $("btnTest").onclick = async () => {
      const msg = encodeURIComponent($("testMsg").value || "miro alrededor");
      const text = await api("/turn?msg=" + msg);
      $("lastPacket").textContent = text;
      toast("TURN OK");
      await refresh();
    };
    refresh().catch(e => {
      $("statusBox").innerHTML = '<span class="led"></span>ERROR: ' + e;
      $("statusBox").className = "status bad";
    });
  </script>
</body>
</html>
